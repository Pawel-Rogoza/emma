name: Emma · TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emma-testflight
  cancel-in-progress: false

jobs:
  distribute:
    name: Gemini Live → TestFlight
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Pobierz gałąź z Gemini Live
        uses: actions/checkout@v4
        with:
          ref: feat/gemini-live-voice
          persist-credentials: false

      - name: Wybierz Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Zainstaluj XcodeGen i wygeneruj projekt
        working-directory: ios
        run: |
          brew install xcodegen
          ./scripts/generate-project.sh

      - name: Zbuduj, podpisz i wyślij do TestFlight
        working-directory: ios
        env:
          IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_DISTRIBUTION_PROFILE_BASE64: ${{ secrets.IOS_DISTRIBUTION_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
        run: bash scripts/distribute-testflight.sh
