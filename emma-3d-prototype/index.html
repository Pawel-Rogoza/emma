<main class="phone"><header><h1>Dzień dobry, Tomaszu</h1><span class="user">TR</span></header>

<section class="actions"><button id="voice" class="primary"><svg><use href="#mic"/></svg><span>Porozmawiaj głosem</span></button><button id="write" class="secondary"><svg><use href="#keyboard"/></svg>Napisz do Emmy</button><button id="today" class="text-button"><svg><use href="#tasks"/></svg>Zadania na dziś</button></section>
<nav aria-label="Nawigacja aplikacji"><button aria-current="page"><svg><use href="#home"/></svg>Dzisiaj</button><button><svg><use href="#people"/></svg>Klienci</button><button><span class="emma-tab"><svg><use href="#spark"/></svg></span>Emma</button><button><span class="chat-icon"><svg><use href="#chat"/></svg><b>3</b></span>Rozmowy</button><button><svg><use href="#calendar"/></svg>Kalendarz</button></nav></main>
